name: Bug report
description: Something in Measure Twice is broken or gives a wrong result.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in Measure Twice. Please don't include personal data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and what the app showed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which calculator, which inputs, and what you clicked.
      placeholder: |
        1. Open the Paint tab
        2. Enter ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app footer (for example 1.1.0).
  - type: input
    id: environment
    attributes:
      label: Browser / OS
      description: For example "Firefox 130 on Windows 11".
  - type: textarea
    id: notes
    attributes:
      label: Screenshots / notes
      description: Drag images here or add anything else that helps.
